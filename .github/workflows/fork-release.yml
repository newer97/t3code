name: Fork macOS Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-macos-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'newer97/t3code'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false
      - name: Install dependencies
        run: vp install
      - name: Verify RTL behavior
        run: |
          vp test run apps/web/src/components/chat/MessagesTimeline.test.tsx apps/web/src/components/ChatMarkdown.test.tsx apps/mobile/src/lib/textDirection.test.ts scripts/build-desktop-artifact.test.ts
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/mobile typecheck
          vp run --filter @t3tools/desktop typecheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Prepare fork version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          version="${base_version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          node scripts/update-release-package-versions.ts "$version"
          cp .env.example .env
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Build signed and notarized Apple Silicon DMG
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: newer97/t3code
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/t3code.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$T3CODE_MACOS_PROVISIONING_PROFILE"
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$BUILD_VERSION" --signed --verbose
          for dmg in release/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -f release/nightly-mac.yml
          files=(release/*.dmg release/*.zip release/*.blockmap release/nightly-mac.yml)
          (( ${#files[@]} >= 3 ))
          shasum -a 256 "${files[@]}" > release/SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Personal Apple Silicon build of T3 Code with Arabic/Hebrew message direction from upstream PR #10779.

          Signed and notarized under shaden alawaji (XF983AFG67), bundle ID dev.snaya.t3code. Includes the bundled server.

          T3 Code (Nightly) RTL checks this fork for updates on the Nightly track. Use the normal update button to download and restart. Install this DMG once to switch from upstream or the older unsigned preview.

          Remote servers remain separate installations; this fork version is not published to npm. Native T3 Connect passkeys require upstream domain authorization for this Apple team; passkey code is unchanged.

          Original RTL work by @ShlomiPorush; upstream rebuild by @haithamassoli.
          NOTES
          gh release create "$RELEASE_TAG" "${files[@]}" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "T3 Code (Nightly) RTL $RELEASE_VERSION — macOS Apple Silicon" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
