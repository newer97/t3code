name: Fork Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-macos-release
  cancel-in-progress: false

jobs:
  # Both builds and the publish step must agree on one version, and the date
  # part could roll over between jobs, so it is decided once here.
  version:
    if: github.repository == 'newer97/t3code' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          version="${base_version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  mac:
    name: Desktop macOS arm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Install browser test runtime
        working-directory: apps/web
        run: vp exec playwright install chromium
      - name: Verify RTL behavior
        run: |
          vp test run apps/web/src/components/chat/MessagesTimeline.browser.test.tsx apps/web/src/components/ChatMarkdown.browser.test.tsx -t "RTL"
          vp test run apps/web/src/lib/textDirection.test.ts apps/mobile/src/lib/textDirection.test.ts scripts/build-desktop-artifact.test.ts
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/mobile typecheck
          vp run --filter @t3tools/desktop typecheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Align package versions to release version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"
          cp .env.example .env
      - name: Build signed and notarized Apple Silicon DMG
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: newer97/t3code
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/t3code.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$T3CODE_MACOS_PROVISIONING_PROFILE"
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$BUILD_VERSION" --signed --verbose
          # Validate the stapled app without changing artifacts after updater hashes are generated.
          mount_dir="$RUNNER_TEMP/verify-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach release/*.dmg -mountpoint "$mount_dir" -nobrowse -readonly
          trap 'hdiutil detach "$mount_dir"' EXIT
          codesign --verify --deep --strict "$mount_dir/T3 Code (Nightly) RTL.app"
          xcrun stapler validate "$mount_dir/T3 Code (Nightly) RTL.app"
          test -f release/nightly-mac.yml
      # The DMG bundles the server inside the app; `t3 update` on a macOS
      # server needs the standalone CLI archive. Mirrors the mac `cli_archive`
      # steps of release-desktop.yml, reusing the resource monitor the desktop
      # build just compiled.
      - name: Build server bundle and web client
        run: vp run --filter t3 build
      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
      # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.12.1"
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Verify T3 Connect config is baked in
        run: grep -rqF "https://relay.t3.codes" apps/server/dist-exe
      - name: Import signing certificate for the CLI archive
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/t3-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          cert_path="$RUNNER_TEMP/t3-cli-signing.p12"
          printf '%s' "$CSC_LINK" | base64 -D > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          test -n "$identity"
          echo "T3CODE_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build signed and notarized CLI archive
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_cli_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/darwin-arm64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts \
            --platform mac \
            --arch arm64 \
            --version "${{ needs.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.version.outputs.version }}"
      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-darwin-arm64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/nightly-mac.yml
          if-no-files-found: error
          retention-days: 1

  # The self-contained CLI archive remote Linux servers download when the app
  # updates them. Mirrors the `cli_archive` steps of release-desktop.yml.
  linux_cli:
    name: CLI Linux x64
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: newer97/t3code
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/scripts...
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
      # The .env carries T3 Connect's public config (relay URL, Clerk IDs) into
      # the server bundle. Without it the CLI builds with Connect disabled and
      # updated servers drop off the relay.
      - name: Align package versions to release version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"
          cp .env.example .env
      - name: Build server bundle and web client
        run: vp run --filter t3 build
      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
      # The single-executable needs a Node with --build-sea (25.7+). Keep in step
      # with SEA_NODE_VERSION in apps/server/vite.config.ts.
      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.12.1"
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Verify T3 Connect config is baked in
        run: grep -rqF "https://relay.t3.codes" apps/server/dist-exe
      - name: Build CLI archive
        shell: bash
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.version.outputs.version }}"
      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish fork release
    needs: [version, mac, linux_cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release
      # Servers verify the archive against SHA256SUMS, so it is written from
      # the bytes that get uploaded. Its presence is also how the app decides
      # the release is ready for remote servers.
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          (( ${#archives[@]} >= 1 ))
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
          sha256sum *.dmg *.zip *.blockmap nightly-mac.yml > SHA256SUMS.txt
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -f release/nightly-mac.yml
          files=(release/*.dmg release/*.zip release/*.blockmap release/nightly-mac.yml release/t3-*.tar.gz release/SHA256SUMS release/SHA256SUMS.txt)
          (( ${#files[@]} >= 5 ))
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Personal build of T3 Code with Arabic/Hebrew message direction from upstream PR #10779.

          macOS Apple Silicon DMG, signed and notarized under shaden alawaji (XF983AFG67), bundle ID dev.snaya.t3code. Includes the bundled server.

          CLI archives for remote servers: Linux x64 (`t3-<version>-linux-x64.tar.gz`) and macOS Apple Silicon (`t3-<version>-darwin-arm64.tar.gz`). Servers already on this fork update from the app's update button or with `t3 update`. To move a server from upstream onto this fork once, run on it:

          ```
          T3CODE_RELEASE_BASE_URL=https://github.com/newer97/t3code/releases/download t3 update --version <this version>
          ```

          T3 Code (Nightly) RTL checks this fork for updates on the Nightly track. Native T3 Connect passkeys require upstream domain authorization for this Apple team; passkey code is unchanged.

          Original RTL work by @ShlomiPorush; upstream rebuild by @haithamassoli.
          NOTES
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "T3 Code (Nightly) RTL $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
