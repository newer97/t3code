name: Sync RTL fork

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'newer97/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream and push
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already synced with upstream/main."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - uses: voidzero-dev/setup-vp@v1
        if: steps.merge.outputs.updated == 'true'
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - name: Verify RTL behavior
        if: steps.merge.outputs.updated == 'true'
        run: |
          vp install
          vp test run apps/web/src/components/chat/MessagesTimeline.test.tsx apps/web/src/components/ChatMarkdown.test.tsx apps/mobile/src/lib/textDirection.test.ts
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/mobile typecheck
          vp run --filter @t3tools/desktop typecheck
      - name: Push sync
        if: steps.merge.outputs.updated == 'true'
        run: |
          git push origin HEAD:main
